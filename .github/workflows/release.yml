name: Build APK & Pre-release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '预发行标签，如 v0.1.0-pre.1（留空自动生成）'
        required: false
      version_name:
        description: 'versionName，如 0.1.0-pre.1（留空用默认值）'
        required: false
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_VERSION: 9.5.1
  JAVA_VERSION: '21'

jobs:
  build:
    name: 构建 Release APK 并发布预发行
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 配置 JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: 配置 Gradle（依赖缓存）
        uses: gradle/actions/setup-gradle@v4

      # 仓库未提交 gradlew，这里按 gradle-wrapper.properties 的版本临时生成一份
      - name: 准备 Gradle Wrapper
        run: |
          if [ ! -x ./gradlew ]; then
            echo "未检测到 gradlew，下载 Gradle $GRADLE_VERSION 生成 wrapper"
            curl -sSL -o /tmp/gradle.zip \
              "https://services.gradle.org/distributions/gradle-$GRADLE_VERSION-bin.zip"
            unzip -q /tmp/gradle.zip -d "$RUNNER_TEMP"
            export PATH="$RUNNER_TEMP/gradle-$GRADLE_VERSION/bin:$PATH"
            gradle wrapper --gradle-version "$GRADLE_VERSION" --distribution-type bin --no-daemon
          fi
          chmod +x ./gradlew
          ./gradlew --version

      - name: 解析版本与标签
        id: meta
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="$GITHUB_REF_NAME"
            VERSION="${GITHUB_REF_NAME#v}"
          else
            TAG="${{ inputs.tag }}"
            VERSION="${{ inputs.version_name }}"
            [ -z "$TAG" ] && TAG="v0.1.0-pre.${GITHUB_RUN_NUMBER}"
            [ -z "$VERSION" ] && VERSION="${TAG#v}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "构建 $TAG / versionName=$VERSION"

      # 没有配置签名密钥时自动跳过，构建会回落到 debug 密钥，产物仍可安装
      - name: 准备签名密钥（可选）
        id: sign
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/shrunner.jks"
          echo "store=$RUNNER_TEMP/shrunner.jks" >> "$GITHUB_OUTPUT"

      - name: 构建 Release APK
        run: |
          ARGS=(-PVERSION_NAME="${{ steps.meta.outputs.version }}")
          if [ -n "${{ steps.sign.outputs.store }}" ]; then
            ARGS+=(
              -PKEYSTORE_PATH="${{ steps.sign.outputs.store }}"
              -PKEYSTORE_PASSWORD="${{ secrets.KEYSTORE_PASSWORD }}"
              -PKEY_ALIAS="${{ secrets.KEY_ALIAS }}"
              -PKEY_PASSWORD="${{ secrets.KEY_PASSWORD }}"
            )
          fi
          ./gradlew :app:assembleRelease --no-daemon --stacktrace "${ARGS[@]}"

      - name: 整理产物
        id: apk
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          if [ -z "$APK" ]; then echo "::error::未找到 APK 产物"; exit 1; fi
          OUT="ShRunner-${{ steps.meta.outputs.version }}.apk"
          cp "$APK" "$OUT"
          echo "apk=$OUT" >> "$GITHUB_OUTPUT"
          echo "sha=$(sha256sum "$OUT" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ShRunner-${{ steps.meta.outputs.version }}
          path: ${{ steps.apk.outputs.apk }}
          retention-days: 30

      - name: 发布到预发行
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ShRunner ${{ steps.meta.outputs.tag }}
          prerelease: true
          generate_release_notes: true
          files: ${{ steps.apk.outputs.apk }}
          body: |
            预发行版本（Pre-release），由 GitHub Actions 自动构建。
            - 提交：`${{ github.sha }}`
            - 签名：${{ steps.sign.outputs.store != '' && '正式签名' || 'Debug 签名（仅供测试安装）' }}
            - SHA-256：`${{ steps.apk.outputs.sha }}`
