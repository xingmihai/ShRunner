name: Pre-release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pre-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="$(command -v sdkmanager || true)"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="$(find "$ANDROID_HOME" -name sdkmanager -type f 2>/dev/null | head -n 1)"
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-37" "build-tools;36.0.0" 2>&1 | tail -n 5 || true
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Set up Gradle 9.6.0
        run: |
          curl -sSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-9.6.0-bin.zip
          sudo unzip -q /tmp/gradle.zip -d /opt
          sudo ln -sfn /opt/gradle-9.6.0 /opt/gradle
          echo "/opt/gradle/bin" >> "$GITHUB_PATH"

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > shrunner-release.jks
            echo "已恢复签名文件（$(stat -c%s shrunner-release.jks) 字节）"
            {
              echo "KEYSTORE_FILE=$PWD/shrunner-release.jks"
              echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "KEY_ALIAS=$KEY_ALIAS"
              echo "KEY_PASSWORD=$KEY_PASSWORD"
            } >> local.properties
          else
            echo "未配置签名 secrets，本次用 debug 签名打可安装包"
          fi

      - name: Build release APK
        id: apkbuild
        env:
          ORG_GRADLE_PROJECT_ciBuild: "true"
        run: |
          gradle --stacktrace :app:assembleRelease 2>&1 | tail -n 120
          exit "${PIPESTATUS[0]}"

      - name: Locate APK
        id: apk
        run: |
          APK=$(find app/build/outputs -type f -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "未找到 APK，列出输出目录："
            find app/build/outputs -maxdepth 3 2>/dev/null || true
            exit 1
          fi
          echo "找到: $APK"
          if [ "${GITHUB_REF#refs/tags/}" != "$GITHUB_REF" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            VER=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"(.*)".*/\1/')
            TAG="v${VER:-0.1.0}-${GITHUB_RUN_NUMBER}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          mkdir -p out
          cp "$APK" "out/ShRunner-${TAG}.apk"
          ls -lh out

      - name: Verify signature
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | head -n 1)
          if [ -z "$APKSIGNER" ]; then
            echo "未找到 apksigner，跳过验证"
            exit 0
          fi
          "$APKSIGNER" verify --print-certs out/*.apk 2>&1 | head -n 20

      - name: Publish pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.apk.outputs.tag }}
          name: ShRunner ${{ steps.apk.outputs.tag }}
          prerelease: true
          generate_release_notes: true
          files: out/*.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShRunner-${{ steps.apk.outputs.tag }}
          path: out/*.apk
          retention-days: 30
