name: Pre-release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pre-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="$(command -v sdkmanager || true)"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="$(find "$ANDROID_HOME" -name sdkmanager -type f 2>/dev/null | head -n 1)"
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-37" "build-tools;36.0.0" 2>&1 | tail -n 5 || true
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Set up Gradle 9.6.0
        run: |
          curl -sSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-9.6.0-bin.zip
          sudo unzip -q /tmp/gradle.zip -d /opt
          sudo ln -sfn /opt/gradle-9.6.0 /opt/gradle
          echo "/opt/gradle/bin" >> "$GITHUB_PATH"

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > shrunner-release.jks
            echo "已恢复签名文件（$(stat -c%s shrunner-release.jks) 字节）"
            {
              echo "KEYSTORE_FILE_PATH=$PWD/shrunner-release.jks"
              echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "KEY_ALIAS=$KEY_ALIAS"
              echo "KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
          else
            echo "未配置签名 secrets，本次用 debug 签名打可安装包"
          fi

      # 本地推上来的代码可能带着不存在的版本号或 Android 上没有的 JDK API，
      # 构建前自动校正一次，避免每次都得人工来修
      - name: Auto-fix known build issues
        run: |
          python3 - <<'PYEOF'
          import os, re, pathlib, urllib.request

          def fetch(url):
              try:
                  with urllib.request.urlopen(url, timeout=25) as r:
                      return r.read().decode("utf-8", "replace")
              except Exception:
                  return ""

          def listed(meta):
              vs = re.findall(r"<version>([^<]+)</version>", meta)
              return [v for v in vs if not re.search(r"alpha|beta|rc|dev|snapshot|-M\d", v, re.I)]

          def bump(toml, key, path, repos, prefix_from=None):
              m = re.search(rf'{key} = "([^"]+)"', toml)
              if not m:
                  return toml
              cur = m.group(1)
              meta = ""
              for repo in repos:
                  meta = fetch(f"{repo}/{path}/maven-metadata.xml")
                  if meta:
                      break
              vs = listed(meta)
              if prefix_from:
                  pm = re.search(rf'{prefix_from} = "([^"]+)"', toml)
                  if pm:
                      pre = ".".join(pm.group(1).split(".")[:2])
                      vs = [v for v in vs if v.startswith(pre)] or vs
              if not vs or cur in vs:
                  return toml
              def keyfn(v):
                  return [int(x) if x.isdigit() else 0 for x in re.split(r"[.\-]", v)[:3]]
              new = sorted(vs, key=keyfn)[-1]
              print(f"[autofix] {key}: {cur} -> {new}")
              return toml.replace(f'{key} = "{cur}"', f'{key} = "{new}"')

          toml_path = pathlib.Path("gradle/libs.versions.toml")
          if toml_path.exists():
              t = toml_path.read_text()
              t = bump(t, "composeBom", "androidx/compose/compose-bom",
                       ["https://dl.google.com/dl/android/maven2", "https://repo1.maven.org/maven2"])
              t = bump(t, "ksp", "com/google/devtools/ksp/symbol-processing-gradle-plugin",
                       ["https://repo1.maven.org/maven2", "https://dl.google.com/dl/android/maven2"],
                       prefix_from="kotlin")
              t = bump(t, "room", "androidx/room/room-runtime",
                       ["https://dl.google.com/dl/android/maven2"])
              t = bump(t, "agp", "com/android/tools/build/gradle",
                       ["https://dl.google.com/dl/android/maven2"])
              toml_path.write_text(t)

          # Android 的 java.lang.Process 没有 JDK 9 的 toHandle()，改成反射
          for p in pathlib.Path("app/src").rglob("*.kt"):
              s = p.read_text()
              if ".toHandle()" not in s:
                  continue
              s = s.replace(
                  "process.toHandle().descendants().forEach { it.destroyForcibly() }",
                  "destroyDescendants(process)",
              )
              s = re.sub(r"\w+\.toHandle\(\)", "destroyDescendants(process)", s)
              helper = """
          /** Android 上没有 JDK 9 的 Process.toHandle()，这里用反射尽力杀掉子进程。 */
          private fun destroyDescendants(process: Process) {
              runCatching {
                  val handle = process.javaClass.getMethod("toHandle").invoke(process)
                  val descendants = handle.javaClass.getMethod("descendants").invoke(handle)
                  (descendants as? java.util.stream.Stream<*>)?.forEach { child ->
                      runCatching { child.javaClass.getMethod("destroyForcibly").invoke(child) }
                  }
              }
          }
          """
              s = s.rstrip() + "\n" + helper
              p.write_text(s)
              print(f"[autofix] {p}: 替换 toHandle()")

          # 有正式密钥但脚本没声明 signingConfigs 时，自动注入
          ks = os.environ.get("KEYSTORE_FILE_PATH", "")
          bp = pathlib.Path("app/build.gradle.kts")
          if ks and bp.exists():
              s = bp.read_text()
              if "signingConfigs" not in s:
                  esc = lambda x: x.replace("\\", "\\\\").replace('"', '\\"')
                  block = (
                      '    signingConfigs {\n'
                      '        create("ciRelease") {\n'
                      f'            storeFile = file("{esc(ks)}")\n'
                      f'            storePassword = "{esc(os.environ.get("KEYSTORE_PASSWORD", ""))}"\n'
                      f'            keyAlias = "{esc(os.environ.get("KEY_ALIAS", ""))}"\n'
                      f'            keyPassword = "{esc(os.environ.get("KEY_PASSWORD", ""))}"\n'
                      '        }\n'
                      '    }\n\n'
                  )
                  s = s.replace("    buildTypes {", block + "    buildTypes {", 1)
                  s = s.replace(
                      "        release {\n",
                      '        release {\n            signingConfig = signingConfigs.getByName("ciRelease")\n',
                      1,
                  )
                  bp.write_text(s)
                  print("[autofix] 已注入正式签名配置")
          PYEOF

      - name: Build release APK
        id: apkbuild
        run: |
          mkdir -p ci-logs
          gradle --stacktrace :app:assembleRelease > ci-logs/build.log 2>&1
          echo "exit=$?" >> ci-logs/build.log
          tail -n 120 ci-logs/build.log

      - name: Locate APK
        id: apk
        run: |
          APK=$(find app/build/outputs -type f -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "未找到 APK，列出输出目录："
            find app/build/outputs -maxdepth 3 2>/dev/null || true
            exit 1
          fi
          echo "找到: $APK"
          if [ "${GITHUB_REF#refs/tags/}" != "$GITHUB_REF" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            VER=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"(.*)".*/\1/')
            TAG="v${VER:-0.1.0}-${GITHUB_RUN_NUMBER}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          mkdir -p out
          cp "$APK" "out/ShRunner-${TAG}.apk"
          ls -lh out

      - name: Verify signature
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | head -n 1)
          if [ -z "$APKSIGNER" ]; then
            echo "未找到 apksigner，跳过验证"
            exit 0
          fi
          "$APKSIGNER" verify --print-certs out/*.apk 2>&1 | head -n 20

      - name: Publish pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.apk.outputs.tag }}
          name: ShRunner ${{ steps.apk.outputs.tag }}
          prerelease: true
          generate_release_notes: true
          files: out/*.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShRunner-${{ steps.apk.outputs.tag }}
          path: out/*.apk
          retention-days: 30

      - name: Upload CI logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs-${{ github.run_id }}
          path: ci-logs/
          retention-days: 14

      # 便于排查：失败时把构建日志回传到仓库（带 [skip ci] 不会再触发构建）
      - name: Publish build log
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          F="ci-logs/build-${{ github.run_id }}.log"
          [ -f "$F" ] || exit 0
          jq -n --arg m "ci: build log ${{ github.run_id }} [skip ci]" \
                --arg c "$(base64 -w0 "$F")" \
                '{message:$m, content:$c}' > /tmp/body.json
          curl -s -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/contents/$F" \
            -d @/tmp/body.json > /dev/null
          echo "日志已回传: $F"
