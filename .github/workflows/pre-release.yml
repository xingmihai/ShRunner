name: Pre-release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pre-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK (API 37 / build-tools 36)
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="$(command -v sdkmanager)"
          [ -n "$SDKMANAGER" ] || SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-37" "build-tools;36.0.0" || true
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Set up Gradle 9.6.0
        run: |
          curl -sSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-9.6.0-bin.zip
          sudo unzip -q /tmp/gradle.zip -d /opt
          sudo ln -sfn /opt/gradle-9.6.0 /opt/gradle
          echo "/opt/gradle/bin" >> "$GITHUB_PATH"

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Gradle wrapper
        continue-on-error: true
        run: |
          mkdir -p ci-logs
          gradle wrapper --gradle-version 9.6.0 --distribution-type bin > ci-logs/wrapper.log 2>&1
          echo "exit=$?" >> ci-logs/wrapper.log
          if [ -f gradlew ]; then git add -f gradlew gradlew.bat gradle/wrapper; fi

      - name: Generate CI keystore
        run: |
          keytool -genkeypair -v \
            -keystore shrunner.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias shrunner \
            -storepass android -keypass android \
            -dname "CN=ShRunner, OU=Dev, O=ShRunner, C=CN" > /dev/null

      - name: Build release APK
        id: apkbuild
        continue-on-error: true
        run: |
          mkdir -p ci-logs
          if [ -f gradlew ]; then chmod +x gradlew; RUN=./gradlew; else RUN=gradle; fi
          $RUN --stacktrace :app:assembleRelease 2>&1 | tee ci-logs/build.log

      - name: Rename APK
        if: steps.apkbuild.outcome == 'success'
        id: apk
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [ "$TAG" = "${GITHUB_REF}" ]; then TAG="v0.1.0-${GITHUB_RUN_NUMBER}"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          mkdir -p ci-logs out
          { find app/build/outputs -type f | head -40; echo "--- ls ---"; ls -R app/build/outputs | head -40; } 2>&1 | tee ci-logs/rename.log
          APK=$(find app/build/outputs -type f -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then echo "APK not found"; exit 1; fi
          cp "$APK" "out/ShRunner-${TAG}.apk"
          ls -lh out

      - name: Publish pre-release
        if: steps.apkbuild.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.apk.outputs.tag }}
          name: "ShRunner ${{ steps.apk.outputs.tag }} (Pre-release)"
          prerelease: true
          generate_release_notes: true
          files: out/*.apk

      - name: Commit CI diagnostics
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f ci-logs gradlew gradlew.bat gradle/wrapper 2>/dev/null || true
          git commit -m "ci: diagnostics + wrapper [skip ci]" || echo "nothing to commit"
          git pull --rebase --autostash origin main || true
          git push origin HEAD:main || echo "push skipped"
