name: Pre-release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pre-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # 固定镜像：ubuntu-latest 自 2026-10-19 起逐步迁移到 Ubuntu 26.04，
    # 期间会持续打印迁移警告且系统库可能变化。这里锁定 24.04 保证构建可复现。
    # 如需提前验证新镜像，改成 ubuntu-26.04 即可。
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK (API 37 / build-tools 36)
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="$(command -v sdkmanager)"
          [ -n "$SDKMANAGER" ] || SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-37" "build-tools;36.0.0" || true
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Set up Gradle 9.6.0
        run: |
          curl -sSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-9.6.0-bin.zip
          sudo unzip -q /tmp/gradle.zip -d /opt
          sudo ln -sfn /opt/gradle-9.6.0 /opt/gradle
          echo "/opt/gradle/bin" >> "$GITHUB_PATH"

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v6.4.1

      - name: Ensure Gradle wrapper
        continue-on-error: true
        run: |
          mkdir -p ci-logs
          gradle wrapper --gradle-version 9.6.0 --distribution-type bin > ci-logs/wrapper.log 2>&1
          echo "exit=$?" >> ci-logs/wrapper.log
          if [ -f gradlew ]; then git add -f gradlew gradlew.bat gradle/wrapper; fi

      - name: Install NDK and CMake
        run: |
          SDKMAN="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMAN" ]; then
            SDKMAN=$(find "$ANDROID_HOME" -name sdkmanager -type f | head -n 1)
          fi
          if [ -z "$SDKMAN" ]; then
            echo "未找到 sdkmanager，尝试让 AGP 自动下载 NDK"
            exit 0
          fi
          yes | "$SDKMAN" --sdk_root="$ANDROID_HOME" --licenses >/dev/null 2>&1 || true
          "$SDKMAN" --sdk_root="$ANDROID_HOME" --install "platform-tools" "build-tools;36.0.0" "ndk;27.0.12077973" "cmake;3.22.1" 2>&1 | tail -n 5 || true
          echo "已安装 SDK 组件"

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > shrunner-release.jks
            echo "已恢复签名文件（$(stat -c%s shrunner-release.jks) 字节）"
            {
              echo "KEYSTORE_FILE=shrunner-release.jks"
              echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "KEY_ALIAS=$KEY_ALIAS"
              echo "KEY_PASSWORD=$KEY_PASSWORD"
            } > local.properties
          else
            echo "未配置签名 secrets，本次打未签名包"
          fi

      - name: Build release APK
        id: apkbuild
        continue-on-error: true
        run: |
          mkdir -p ci-logs
          set -o pipefail
          if [ -f gradlew ]; then chmod +x gradlew; RUN=./gradlew; else RUN=gradle; fi
          $RUN --stacktrace :app:assembleRelease > ci-logs/build.log 2>&1

      - name: Check bundled pty tool
        if: steps.apkbuild.outcome == 'success'
        run: |
          mkdir -p ci-logs
          APK=$(find app/build/outputs -type f -name "*.apk" | head -n 1)
          {
            echo "== APK 内置 PTY 工具检查 =="
            unzip -l "$APK" | grep -E "lib/.*\.so" || echo "未找到任何 .so"
          } | tee ci-logs/pty.log
          # 没打包进去就让这一步失败，避免悄悄发布一个缺 PTY 的包
          if unzip -l "$APK" | grep -q "libshpty.so"; then
            echo "shpty 已打包" | tee -a ci-logs/pty.log
          else
            echo "shpty 缺失" | tee -a ci-logs/pty.log
            exit 1
          fi

      - name: Static sanity check
        run: |
          mkdir -p ci-logs
          {
            echo "== 静态检查 =="
            SRC=app/src/main/kotlin
            echo "-- !! 强解包 --"
            grep -rn '\w!!' "$SRC" || echo "无"
            echo "-- 主线程忙等 --"
            grep -rn 'Thread.sleep' "$SRC" || echo "无"
            echo "-- 空 catch --"
            grep -rnE 'catch[^)]*\)\s*\{\s*\}' "$SRC" || echo "无"
          } | tee ci-logs/static.log

      - name: Verify signature
        if: steps.apkbuild.outcome == 'success'
        run: |
          APK=$(find app/build/outputs -type f -name "*.apk" | head -n 1)
          echo "验证: $APK"
          mkdir -p ci-logs
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | head -n 1)
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs "$APK" 2>&1 | tee ci-logs/sign.log
          else
            echo "未找到 apksigner" | tee ci-logs/sign.log
          fi

      - name: Rename APK
        if: steps.apkbuild.outcome == 'success'
        id: apk
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [ "$TAG" = "${GITHUB_REF}" ]; then
            VER=$(grep -m1 "versionName = " app/build.gradle.kts | sed -E 's/.*"(.*)".*/\1/')
            TAG="v${VER:-0.1.0}-${GITHUB_RUN_NUMBER}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          mkdir -p ci-logs out
          { find app/build/outputs -type f | head -40; echo "--- ls ---"; ls -R app/build/outputs | head -40; } 2>&1 | tee ci-logs/rename.log
          APK=$(find app/build/outputs -type f -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then echo "APK not found"; exit 1; fi
          cp "$APK" "out/ShRunner-${TAG}.apk"
          ls -lh out

      - name: Publish pre-release
        if: steps.apkbuild.outcome == 'success'
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ steps.apk.outputs.tag }}
          name: "ShRunner ${{ steps.apk.outputs.tag }} (Pre-release)"
          prerelease: true
          generate_release_notes: true
          files: out/*.apk

      - name: Upload CI logs
        if: steps.apkbuild.outcome == 'failure'
        run: |
          mkdir -p ci-logs
          for f in ci-logs/*; do
            [ -f "$f" ] || continue
            NAME="$(basename "$f")-$GITHUB_RUN_ID.log"
            B64=$(base64 -w0 "$f")
            jq -n --arg m "ci: $NAME [skip ci]" --arg c "$B64" '{message:$m, content:$c}' > /tmp/body.json
            curl -s -X PUT -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/contents/ci-logs/$NAME" \
              -d @/tmp/body.json > /dev/null
          done

      - name: Prune old pre-releases
        if: steps.apkbuild.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURRENT: ${{ steps.apk.outputs.tag }}
        run: |
          set -o pipefail
          # 只保留最新一个预发行：按创建时间倒序，排除刚发布的这个，其余连同 tag 一起删除
          gh release list --repo ${{ github.repository }} --limit 100 \
            --json tagName,isPrerelease,createdAt \
            --jq '.[] | select(.isPrerelease) | "\(.createdAt)\t\(.tagName)"' \
            | sort -r \
            | grep -v -F "$(printf '\t%s' "$CURRENT")" \
            > /tmp/old.txt

          echo "当前 tag: $CURRENT"
          if [ ! -s /tmp/old.txt ]; then
            echo "没有其他预发行，无需清理"
            exit 0
          fi

          echo "待删除的旧预发行："
          cat /tmp/old.txt

          STATUS=0
          while IFS=$'\t' read -r _ tag; do
            [ -z "$tag" ] && continue
            echo "删除：$tag"
            if gh release delete "$tag" --repo ${{ github.repository }} --yes --cleanup-tag; then
              echo "  已删除 $tag"
            else
              echo "  删除失败：$tag"
              STATUS=1
            fi
          done < /tmp/old.txt

          echo "保留：$CURRENT"
          exit $STATUS
