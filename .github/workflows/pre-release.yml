name: Pre-release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pre-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.6.0
        run: |
          curl -sSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-9.6.0-bin.zip
          sudo unzip -q /tmp/gradle.zip -d /opt
          sudo ln -sfn /opt/gradle-9.6.0 /opt/gradle
          echo "/opt/gradle/bin" >> "$GITHUB_PATH"

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Gradle wrapper
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 9.6.0 --distribution-type bin
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f gradlew gradlew.bat gradle/wrapper
            git commit -m "chore: add gradle wrapper [skip ci]" || echo "nothing to commit"
            git push || echo "push skipped"
          fi

      - name: Generate CI keystore
        run: |
          keytool -genkeypair -v \
            -keystore shrunner.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias shrunner \
            -storepass android -keypass android \
            -dname "CN=ShRunner, OU=Dev, O=ShRunner, C=CN" > /dev/null

      - name: Build release APK
        run: |
          if [ -f gradlew ]; then chmod +x gradlew && ./gradlew :app:assembleRelease; else gradle :app:assembleRelease; fi

      - name: Rename APK
        id: apk
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [ "$TAG" = "${GITHUB_REF}" ]; then TAG="v0.1.0-${GITHUB_RUN_NUMBER}"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          mkdir -p out
          for f in app/build/outputs/apk/release/*.apk; do
            cp "$f" "out/ShRunner-${TAG}.apk"
          done
          ls -lh out

      - name: Publish pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.apk.outputs.tag }}
          name: "ShRunner ${{ steps.apk.outputs.tag }} (Pre-release)"
          prerelease: true
          generate_release_notes: true
          files: out/*.apk
